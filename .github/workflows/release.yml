name: Build release APK

# Tag a commit and push it to publish a downloadable APK:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab to get an unsigned build to test.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signing material comes from repository secrets, never from the repo. If the secrets
      # are not set the APK is still built, just unsigned - see the README.
      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run the tests
        run: ./gradlew testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew assembleRelease

      - name: Name the APK after the tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk \
            "out/unscathed-monitor-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
